<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site admin</title>
<script src="/fonts.js"></script>
<style>
:root { --ink:#000; --panel:#0e0e0e; --line:#262626; --text:#f2f2f2; --muted:#a1a1a1; --accent:#ffd400; --bad:#ff6b6b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--ink); color:var(--text); font:16px/1.5 "Inter","Segoe UI",system-ui,sans-serif; }
[hidden] { display:none !important; }

/* top bar */
.topbar { display:flex; align-items:center; gap:16px; height:52px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--ink); position:sticky; top:0; z-index:10; }
.topbar h1 { margin:0; margin-right:auto; font-size:1.125rem; letter-spacing:.02em; text-transform:uppercase; }
.topctl { display:flex; align-items:center; gap:12px; }
.who { color:var(--muted); font-size:.875rem; display:flex; gap:12px; align-items:center; }
.status { color:var(--muted); font-size:.875rem; }
.status.dirty { color:var(--accent); }
#editToggle[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }

/* two panes: editor on the left, the site on the right */
.shell { display:block; }
.shell.nopv .side { max-width:880px; margin:0 auto; padding:24px 20px; }
.shell:not(.nopv) { display:grid; grid-template-columns:minmax(360px, 440px) minmax(0, 1fr); height:calc(100vh - 53px); }
.side { display:flex; flex-direction:column; min-width:0; min-height:0; }
.shell:not(.nopv) .side { height:calc(100vh - 53px); }
#app { display:flex; flex-direction:column; flex:1; min-height:0; }
.side-head { display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line); min-height:56px; }
.side-head h2 { margin:0; font-size:1.0625rem; flex:1; }
.side-body { flex:1; overflow:auto; padding:18px 18px 40px; }
.side-foot { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); background:var(--ink); }
.side-foot .grow { flex:1; }
.livepane { border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0; height:calc(100vh - 53px); }
.pv-bar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:.8125rem; }
.pv-bar button { padding:4px 10px; font-size:.8125rem; }
.pv-bar span { flex:1; }
.livepane iframe { flex:1; width:100%; border:0; background:#000; }
@media (max-width: 900px) {
  .topbar { flex-wrap:wrap; height:auto; padding:10px 14px; } #editToggle { display:none; }
  .shell:not(.nopv) { display:block; height:auto; } .shell:not(.nopv) .side { height:auto; } .side-body { overflow:visible; } .livepane { display:none; }
}

/* buttons and fields */
button, .btn { font:inherit; cursor:pointer; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; text-decoration:none; display:inline-block; }
button:hover, .btn:hover { border-color:var(--accent); }
button.primary, .btn.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
button.danger:hover { border-color:var(--bad); color:var(--bad); }
button:disabled { opacity:.4; cursor:not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
label { display:grid; gap:6px; font-size:.8125rem; color:var(--muted); }
input, textarea, select { font:inherit; font-size:.9375rem; background:#000; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%; }
textarea { min-height:96px; resize:vertical; }
textarea.tall { min-height:240px; }
.hint { font-size:.8125rem; color:var(--muted); margin:0; }
.check { display:flex; gap:10px; align-items:center; color:var(--text); font-size:.9375rem; }
.check input { width:auto; }
.inrow { display:grid; grid-template-columns:minmax(0, 1fr) 128px; gap:8px; }
select.fontsel { font-size:.8125rem; padding:9px 8px; color:var(--muted); }
label.area .fontsel { justify-self:end; width:150px; }
.preview { max-width:220px; max-height:160px; border-radius:8px; border:1px solid var(--line); display:none; }
.preview.show { display:block; }

/* home screen */
.tip { margin:0 0 4px; padding:12px 14px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); font-size:.875rem; }
.gtitle { margin:24px 0 10px; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.navlist { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.navrow { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.navrow .t { flex:1; display:grid; gap:1px; min-width:0; }
.navrow .t b { font-weight:600; font-size:.9375rem; }
.navrow .t small { color:var(--muted); font-size:.8125rem; }
.navrow .chev { color:var(--muted); font-size:1.25rem; line-height:1; }

/* lists of photos, articles and quotes */
.addbtn { width:100%; padding:11px; margin-bottom:14px; }
.irow { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; }
.irow:hover, .irow:focus-visible { border-color:var(--accent); outline:none; }
.irow:not(.hasimg) { grid-template-columns:minmax(0, 1fr) auto; padding:12px 14px; }
.irow img { width:52px; height:52px; object-fit:cover; border-radius:8px; background:#1a1a1a; display:block; }
.irow b { display:block; font-weight:600; font-size:.9375rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.irow small { display:block; color:var(--muted); font-size:.8125rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini { display:flex; flex-direction:column; gap:4px; }
.mini button, .tool { padding:2px 9px; font-size:.8125rem; line-height:1.5; }
.empty { color:var(--muted); text-align:center; padding:30px 10px; border:1px dashed var(--line); border-radius:12px; }
#itemform { display:grid; gap:16px; }

/* page sections */
details.acc { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
details.acc > summary { list-style:none; cursor:pointer; padding:13px 14px; font-weight:600; font-size:.9375rem; display:flex; justify-content:space-between; align-items:center; }
details.acc > summary::-webkit-details-marker { display:none; }
details.acc > summary::after { content:"+"; color:var(--muted); font-size:1.25rem; line-height:1; }
details.acc[open] > summary::after { content:"\2013"; }
.acc-body { display:grid; gap:16px; padding:2px 14px 16px; }
.rowbox { border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:10px; background:#0a0a0a; }
.rowtools { display:flex; gap:4px; justify-content:flex-end; }
.cols { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); align-items:start; }

/* page builder */
.builder { display:grid; gap:10px; }
.bcard { border:1px solid var(--line); border-radius:12px; background:#0a0a0a; }
.bcard.over { border-color:var(--accent); }
.bhead { display:flex; align-items:center; gap:8px; padding:8px 10px; }
.handle { cursor:grab; color:var(--muted); padding:2px 6px; user-select:none; font-size:1rem; }
.btitle { flex:1; min-width:0; background:none; border:0; text-align:left; padding:4px 2px; display:grid; gap:0; }
.btitle b { font-size:.875rem; font-weight:600; }
.btitle small { color:var(--muted); font-size:.75rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bbody { display:grid; gap:14px; padding:4px 12px 14px; border-top:1px solid var(--line); padding-top:14px; }
.picker { border:1px solid var(--accent); border-radius:12px; padding:14px; display:grid; gap:10px; background:var(--panel); }
.picker .gtitle { margin:6px 0 2px; }
.pgrid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
.pick { text-align:left; display:grid; gap:1px; padding:9px 10px; border-radius:10px; background:#000; }
.pick b { font-size:.875rem; font-weight:600; }
.pick small { color:var(--muted); font-size:.75rem; line-height:1.3; }
.dangerzone { margin-top:6px; }
.logoprev { height:54px; background:#0a0a0a; border:1px solid var(--line); border-radius:8px; display:grid; place-items:center; padding:8px; }
.logoprev img { max-height:34px; max-width:100%; filter:brightness(0) invert(1); }
.logoprev span { color:var(--muted); font-size:.8125rem; }
.presets { display:flex; flex-wrap:wrap; gap:6px; }
.stack { display:grid; gap:14px; justify-items:start; }
.stack label { width:100%; }
.stack .hint { margin-top:2px; }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:12px 18px; max-width:calc(100vw - 32px); display:none; z-index:20; }
#toast.bad { border-color:var(--bad); }
#toast.show { display:block; }
.login { text-align:center; padding:80px 0; display:grid; gap:18px; justify-items:center; }
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <h1>Site admin</h1>
  <div class="topctl" id="topctl" hidden>
    <button type="button" id="editToggle" aria-pressed="true">Edit on the page: On</button>
    <span class="status" id="status"></span>
    <button type="button" class="primary" id="save" disabled>Save to site</button>
  </div>
  <div class="who" id="who" hidden><span id="who-name"></span><a class="btn" href="/" target="_blank" rel="noopener">View site</a><button type="button" id="signout">Sign out</button></div>
</div>

<div class="shell nopv" id="shell">
  <div class="side" id="side">
    <section id="login" class="login" hidden>
      <p>Sign in with GitHub to edit your site.</p>
      <a class="btn primary" href="/api/login">Sign in with GitHub</a>
    </section>
    <div id="app" hidden>
      <div class="side-head"><button type="button" class="back" id="back" hidden>&#8249; Back</button><h2 id="sideTitle"></h2></div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot" id="sideFoot" hidden></div>
    </div>
  </div>
  <aside class="livepane" id="previewPane" hidden>
    <div class="pv-bar"><button type="button" id="pvBack" title="Go back in the site, or close an open photo">&#8249; Back</button><span>Your site. Click any text to edit it right here. Changes are saved when you press Save to site.</span><button type="button" id="pvRefresh">Refresh</button></div>
    <iframe id="pv" title="Preview of your site"></iframe>
  </aside>
</div>
<div id="toast" role="status"></div>

<script>
const SCHEMAS = {
  photos: {
    singular: "photo", plural: "Photos", count: "photos",
    autoSlug: true, slugFrom: p => p.caption || p.place,
    title: p => p.caption || p.place,
    sub: p => [p.place, p.when].filter(Boolean).join(" · "),
    imgKey: "img",
    blank: () => ({ img: "", place: "", when: "", story: [] }),
    fields: [
      { k: "img", type: "image", label: "Photo", required: true },
      { k: "place", label: "Place (shown on hover)", required: true },
      { k: "caption", label: "Caption (optional, replaces the place in the story view)" },
      { k: "when", label: "When (for example August 2026)", required: true },
      { k: "story", type: "paras", label: "Story (optional, leave a blank line between paragraphs)" }
    ]
  },
  writing: {
    singular: "article", plural: "Articles", count: "articles",
    title: w => w.t,
    sub: w => `${w.d} · ${w.pub === "site" ? "only on this site" : w.pub}`,
    imgKey: "img",
    autoSlug: true,
    blank: () => ({ d: new Date().toISOString().slice(0, 10), pub: "site", t: "" }),
    fields: [
      { k: "t", label: "Title", required: true },
      { k: "d", type: "date", label: "Date", required: true },
      { k: "where", virtual: true, type: "select", options: [["site", "Only on this site (I write it here)"], ["other", "Published on another website"]], get: w => (!w.pub || w.pub === "site") ? "site" : "other", label: "Where does this article live?" },
      { k: "pub", showIf: v => v.where !== "site", list: ["medium.com", "substack.com", "linkedin.com"], label: "Which website? (for example medium.com)" },
      { k: "body", type: "paras", tall: true, showIf: v => v.where === "site", label: "Full article. Leave a blank line between paragraphs. Start a line with ## for a heading, or > for a highlighted quote." },
      { k: "u", type: "url", showIf: v => v.where !== "site", label: "Link to the article" },
      { k: "img", type: "image", label: "Cover image (optional for articles on this site)" },
      { k: "x", type: "textarea", label: "Short summary", required: true }
    ]
  },
  quotes: {
    singular: "quote", plural: "Quotes", count: "quotes",
    title: q => q.q.length > 70 ? q.q.slice(0, 70) + "..." : q.q,
    sub: q => `${q.a} · ${q.d.split("-").reverse().join(".")}${q.u ? "" : " · no link"}`,
    blank: () => ({ d: new Date().toISOString().slice(0, 10) }),
    fields: [
      { k: "q", type: "textarea", label: "The quote", required: true },
      { k: "a", label: "Who said it", required: true },
      { k: "u", type: "url", label: "Link to where you read it (their website or the page, optional)" },
      { k: "d", type: "date", label: "Date you added it", required: true }
    ]
  }
};

const PAGES = [
  ["home", "Home", "Banner, section titles, quote block"],
  ["writing", "Writing page", "Heading and intro text"],
  ["photos", "Photos page", "Heading"],
  ["quotes", "Quotes page", "Heading and quote style"],
  ["about", "About", "Introduction, facts, social links"],
  ["contact", "Contact", "Heading, intro, message delivery"]
];
const PAGE_HASH = { home: "#home", writing: "#writing", photos: "#photos", quotes: "#quotes", about: "#about", contact: "#contact" };
const LIST_HASH = { photos: "#photos", writing: "#writing", quotes: "#quotes" };
const linkPages = () => [...LINK_PAGES, ...((state.lists.pages && state.lists.pages.custom) || []).map(p => ["#page/" + p.slug, p.title])];
const LINK_PAGES = [["#home", "Home"], ["#writing", "Writing"], ["#photos", "Photos"], ["#about", "About"], ["#quotes", "Quotes"], ["#contact", "Contact"]];

const $ = id => document.getElementById(id);
const state = { me: null, team: null, view: { name: "home" }, lists: {}, shas: {}, dirty: {}, pending: {}, previews: {}, loading: {}, open: {}, editMode: true };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function btn(label, fn, disabled, cls) {
  const b = el("button", cls, label); b.type = "button"; b.onclick = fn; b.disabled = !!disabled; return b;
}

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", bad ? 7000 : 3500);
}

async function api(path, opts) {
  const r = await fetch(path, { credentials: "same-origin", ...opts });
  let body = null; try { body = await r.json(); } catch {}
  if (r.status === 401) { showLogin(); throw new Error("Please sign in again."); }
  if (!r.ok) throw new Error(((body && body.error) || "Something went wrong.") + (body && body.detail ? " (" + body.detail + ")" : ""));
  return body;
}

function showLogin() { $("login").hidden = false; $("app").hidden = true; $("who").hidden = true; $("topctl").hidden = true; }

async function load(tab) {
  if (state.lists[tab]) return;
  if (!state.loading[tab]) state.loading[tab] = api("/api/content?file=" + tab).then(r => {
    state.lists[tab] = r.data; state.shas[tab] = r.sha; state.pending[tab] = {};
  });
  await state.loading[tab];
}

const mimeOf = p => /\.svg$/i.test(p) ? "image/svg+xml" : /\.png$/i.test(p) ? "image/png" : /\.webp$/i.test(p) ? "image/webp" : "image/jpeg";
function imgSrc(tab, path) {
  const p = (state.pending[tab] && state.pending[tab][path]) || state.previews[path];
  return p ? `data:${mimeOf(path)};base64,` + p : "/" + path;
}

function updateStatus() {
  const dirty = Object.values(state.dirty).some(Boolean);
  $("save").disabled = !dirty;
  $("status").textContent = dirty ? "Unsaved changes" : "Everything is saved";
  $("status").className = "status" + (dirty ? " dirty" : "");
}

// ---------- Navigation ----------
function viewHash() {
  const v = state.view;
  if (v.name === "list" || v.name === "edit") return LIST_HASH[v.arg];
  if (v.name === "page") return PAGE_HASH[v.arg];
  if (v.name === "cpage") { const p = ((state.lists.pages || {}).custom || [])[v.idx]; return p ? "#page/" + p.slug : "#home"; }
  return "#home";
}
async function loadTeam() {
  try { state.team = await api("/api/team"); } catch (e) { toast(e.message, true); state.team = { owner: state.me.login, users: [], tokenConfigured: false }; }
  if (state.view.name === "team") renderView();
}
function go(name, arg, idx) {
  if (name === "team") { state.team = null; loadTeam(); }
  state.view = { name, arg, idx };
  renderView();
  $("sideBody").scrollTop = 0;
  showInPreview(viewHash());
}
function back() { const v = state.view; if (v.name === "edit") go("list", v.arg); else go("home"); }

function viewTitle() {
  const v = state.view;
  switch (v.name) {
    case "list": return SCHEMAS[v.arg].plural;
    case "edit": return (v.idx === null ? "Add " : "Edit ") + SCHEMAS[v.arg].singular;
    case "page": return PAGES.find(p => p[0] === v.arg)[1];
    case "menu": return "Menu and social links";
    case "footer": return "Footer";
    case "team": return "Team";
    case "track": return "Tracking and links";
    case "cpage": { const p = ((state.lists.pages || {}).custom || [])[v.idx]; return p ? p.title : "Page"; }
    default: return "What would you like to change?";
  }
}

function renderView() {
  const v = state.view, body = $("sideBody"), key = JSON.stringify(v);
  const keep = renderView.key === key ? body.scrollTop : 0; renderView.key = key;
  body.innerHTML = ""; $("sideFoot").hidden = true; $("sideFoot").innerHTML = "";
  $("back").hidden = v.name === "home"; $("sideTitle").textContent = viewTitle();
  if (v.name === "home") homeView(body);
  else if (v.name === "list") listView(body, v.arg);
  else if (v.name === "edit") editView(body, v.arg, v.idx);
  else if (v.name === "cpage") cpageView(body);
  else if (v.name === "team") teamView(body);
  else if (v.name === "track") trackView(body);
  else siteView(body);
  body.scrollTop = keep;
  updateStatus();
}

function navRow(title, sub, fn) {
  const li = el("li"), b = el("button", "navrow"); b.type = "button"; b.onclick = fn;
  const t = el("span", "t"); t.append(el("b", "", title), el("small", "", sub));
  b.append(t, el("span", "chev", "›")); li.append(b); return li;
}

function homeView(body) {
  body.append(el("p", "tip", "Tip: you can also click any text on your site on the right and type straight into it."));
  body.append(el("h3", "gtitle", "Pages"));
  const pages = el("ul", "navlist");
  PAGES.forEach(([id, name, sub]) => pages.append(navRow(name, sub, () => go("page", id))));
  body.append(pages);
  body.append(el("h3", "gtitle", "Your own pages"));
  const own = el("ul", "navlist");
  ((state.lists.pages || {}).custom || []).forEach((p, i) => own.append(navRow(p.title, `${(p.blocks || []).length} sections`, () => go("cpage", "", i))));
  own.append(navRow("+ New page", "Build a page from blocks", newPage));
  body.append(own);
  body.append(el("h3", "gtitle", "Your content"));
  const content = el("ul", "navlist");
  ["photos", "writing", "quotes"].forEach(t => {
    const s = SCHEMAS[t], n = (state.lists[t] || []).length;
    content.append(navRow(s.plural, `${n} ${s.count}`, () => go("list", t)));
  });
  body.append(content);
  body.append(el("h3", "gtitle", "Whole site"));
  const site = el("ul", "navlist");
  site.append(navRow("Menu and social links", "Top menu, your name, social links", () => go("menu")));
  site.append(navRow("Footer", "Footer text and links", () => go("footer")));
  site.append(navRow("Tracking and links", "Google Analytics and tracked links to share", () => go("track")));
  if (state.me && state.me.role === "owner") site.append(navRow("Team", "Who else can edit this site", () => go("team")));
  body.append(site);
}

// ---------- Photos, articles and quotes ----------
function touch(tab) { state.dirty[tab] = true; updateStatus(); refreshPreview(); }

function listView(body, tab) {
  const s = SCHEMAS[tab], list = state.lists[tab] || [];
  body.append(btn("+ Add " + s.singular, () => go("edit", tab, null), false, "primary addbtn"));
  if (!list.length) body.append(el("p", "empty", `No ${s.count} yet. Press the button above to add one.`));
  const ul = el("ul", "navlist");
  list.forEach((item, i) => {
    const li = el("li", "irow"), hasImg = s.imgKey && item[s.imgKey];
    li.tabIndex = 0; li.setAttribute("role", "button");
    if (hasImg) { li.classList.add("hasimg"); const im = el("img"); im.src = imgSrc(tab, item[s.imgKey]); im.alt = ""; li.append(im); }
    const t = el("div"); t.append(el("b", "", s.title(item)), el("small", "", s.sub(item)));
    const mini = el("div", "mini");
    const mv = (d, e) => { e.stopPropagation(); [list[i], list[i + d]] = [list[i + d], list[i]]; touch(tab); renderView(); };
    const up = btn("↑", e => mv(-1, e), i === 0), down = btn("↓", e => mv(1, e), i === list.length - 1);
    up.setAttribute("aria-label", "Move up"); down.setAttribute("aria-label", "Move down");
    mini.append(up, down);
    li.append(t, mini);
    li.onclick = () => go("edit", tab, i);
    li.onkeydown = e => { if (e.key === "Enter" && e.target === li) go("edit", tab, i); };
    ul.append(li);
  });
  body.append(ul);
}

// Shrinks a photo in the browser so it uploads fast and the site stays quick.
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const max = 1800, scale = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    im.onerror = () => reject(new Error("That photo could not be read. Use a JPG or PNG."));
    im.src = url;
  });
}

const slug = s => (s || "photo").replace(/['’]/g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/ł/g, "l").replace(/đ/g, "d").replace(/ø/g, "o").replace(/æ/g, "ae").replace(/ß/g, "ss").replace(/œ/g, "oe").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "photo";

function editView(body, tab, index) {
  const s = SCHEMAS[tab], list = state.lists[tab], isNew = index === null;
  const item = isNew ? s.blank() : { ...list[index] };
  let newImg = null; // { path, base64 }
  const form = el("form"); form.id = "itemform"; form.noValidate = false;
  const inputs = {}, labels = {};

  s.fields.forEach(f => {
    const lab = el("label"); lab.append(f.label); labels[f.k] = lab;
    let inp;
    if (f.type === "textarea") { inp = el("textarea"); inp.value = item[f.k] || ""; }
    else if (f.type === "paras") { inp = el("textarea"); if (f.tall) inp.className = "tall"; inp.value = (item[f.k] || []).join("\n\n"); }
    else if (f.type === "select") {
      inp = el("select");
      const opts = f.options.map(o => Array.isArray(o) ? o : [o, o]);
      opts.forEach(o => inp.add(new Option(o[1], o[0])));
      inp.value = f.get ? f.get(item) : item[f.k];
      inp.onchange = sync;
    }
    else if (f.type === "image") {
      inp = el("input"); inp.type = "file"; inp.accept = "image/jpeg,image/png,image/webp";
      const pv = el("img", "preview" + (item[f.k] ? " show" : "")); pv.alt = "";
      if (item[f.k]) pv.src = imgSrc(tab, item[f.k]);
      inp.onchange = async () => {
        if (!inp.files[0]) return;
        try {
          const b64 = await shrink(inp.files[0]);
          newImg = { path: `img/${slug(item.place || item.t)}-${Date.now().toString(36)}.jpg`, base64: b64 };
          pv.src = "data:image/jpeg;base64," + b64; pv.className = "preview show";
        } catch (e) { toast(e.message, true); inp.value = ""; }
      };
      lab.append(inp, pv); form.append(lab); inputs[f.k] = inp; return;
    }
    else {
      inp = el("input"); inp.type = f.type || "text"; inp.value = (f.k === "pub" && item.pub === "site") ? "" : (item[f.k] || "");
      if (f.list) { const dl = el("datalist"); dl.id = "dl-" + f.k; f.list.forEach(o => dl.append(new Option(o))); inp.setAttribute("list", dl.id); lab.append(dl); }
    }
    if (f.required) inp.required = true;
    lab.append(inp); form.append(lab); inputs[f.k] = inp;
  });

  function sync() {
    const v = {}; for (const k in inputs) v[k] = inputs[k].value;
    s.fields.forEach(f => { if (f.showIf) labels[f.k].hidden = !f.showIf(v); });
  }
  sync();
  body.append(form);

  const foot = $("sideFoot"); foot.hidden = false;
  if (!isNew) foot.append(btn("Delete", () => {
    if (!confirm(`Delete "${s.title(list[index])}"? It leaves the site when you press Save to site.`)) return;
    list.splice(index, 1); touch(tab); go("list", tab);
  }, false, "danger"));
  const grow = el("span", "grow"); foot.append(grow, btn("Cancel", () => go("list", tab)));
  const ok = el("button", "primary", isNew ? "Add" : "Done"); ok.type = "submit"; ok.setAttribute("form", "itemform"); foot.append(ok);

  form.onsubmit = e => {
    e.preventDefault();
    const out = { ...item };
    for (const f of s.fields) {
      if (f.virtual) continue;
      if (labels[f.k].hidden) { delete out[f.k]; continue; }
      if (f.type === "image") {
        if (newImg) { out[f.k] = newImg.path; state.pending[tab][newImg.path] = newImg.base64; }
        if (!out[f.k] && f.required) { toast("Please choose a photo.", true); return; }
      } else if (f.type === "paras") {
        out[f.k] = inputs[f.k].value.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
      } else {
        const v = inputs[f.k].value.trim();
        if (v) out[f.k] = v; else delete out[f.k];
      }
    }
    if (tab === "writing") {
      if (inputs.where.value === "site") {
        out.pub = "site";
        if (!(out.body && out.body.length)) { toast("Please write the article text.", true); return; }
      } else {
        if (!out.pub) { toast("Please say which website it was published on.", true); return; }
        if (!out.u) { toast("Please add the link to the article.", true); return; }
      }
    }
    if (s.autoSlug && !out.slug) {
      let base = slug(s.slugFrom ? s.slugFrom(out) : out.t), n = base, i = 2;
      while (list.some(x => x.slug === n)) n = base + "-" + i++;
      out.slug = n;
    }
    if (isNew) list.unshift(out); else list[index] = out;
    touch(tab); go("list", tab);
  };
}

// ---------- Page text, menu and footer ----------
function markSiteDirty() { state.dirty.site = true; updateStatus(); refreshPreview(); }
const fam = n => n ? `"${n}", sans-serif` : "";

// A compact font menu. "id" is the piece of text on the site it applies to.
function fontSelect(id) {
  const d = state.lists.site; d.fonts = d.fonts || {};
  const sel = el("select", "fontsel"); sel.setAttribute("aria-label", "Font"); sel.title = "Font for this text";
  sel.add(new Option("Default font", ""));
  window.FONT_LIST.forEach(n => { const o = new Option(n, n); o.style.fontFamily = fam(n); sel.add(o); });
  sel.value = d.fonts[id] || "";
  sel.onchange = () => { if (sel.value) d.fonts[id] = sel.value; else delete d.fonts[id]; markSiteDirty(); };
  return sel;
}
function fontRow(label, id) { const lab = el("label"); lab.append(label, fontSelect(id)); return lab; }

function textField(label, obj, key, opts = {}) {
  const lab = el("label", opts.area ? "area" : ""); lab.append(label);
  const inp = opts.area ? el("textarea") : el("input");
  inp.value = obj[key] || "";
  inp.oninput = () => { obj[key] = inp.value; (opts.mark || markSiteDirty)(); };
  if (!opts.font) lab.append(inp);
  else if (opts.area) lab.append(inp, fontSelect(opts.font));
  else { const row = el("div", "inrow"); row.append(inp, fontSelect(opts.font)); lab.append(row); }
  return lab;
}

// Choose one of your pages, or paste a website address.
function linkField(label, obj, key) {
  const lab = el("label"); lab.append(label);
  const sel = el("select"), web = el("input");
  const pagesList = linkPages();
  pagesList.forEach(([v, n]) => sel.add(new Option("Page: " + n, v)));
  sel.add(new Option("A website address...", "__web"));
  const custom = !pagesList.some(([v]) => v === obj[key]);
  sel.value = custom ? "__web" : obj[key];
  web.placeholder = "https://..."; web.value = custom ? (obj[key] || "") : ""; web.hidden = !custom;
  sel.onchange = () => {
    if (sel.value === "__web") { web.hidden = false; obj[key] = web.value || "https://"; web.value = obj[key]; web.focus(); }
    else { web.hidden = true; obj[key] = sel.value; }
    markSiteDirty();
  };
  web.oninput = () => { obj[key] = web.value.trim(); markSiteDirty(); };
  lab.append(sel, web); return lab;
}

function checkField(label, obj, key, mark = markSiteDirty) {
  const lab = el("label", "check"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!obj[key];
  cb.onchange = () => { obj[key] = cb.checked; mark(); };
  lab.append(cb, label); return lab;
}

function optionalLink(row) {
  const lab = el("label"); lab.append("Link (optional)");
  const inp = el("input"); inp.placeholder = "#contact or https://..."; inp.value = row.url || "";
  inp.oninput = () => { const v = inp.value.trim(); if (v) row.url = v; else delete row.url; markSiteDirty(); };
  lab.append(inp); return lab;
}

// A collapsible group of fields. The first one on each screen starts open.
function section(title, hint, ...children) {
  const v = state.view, key = v.name + ":" + (v.arg || "") + ":" + title;
  const d = el("details", "acc"); d.dataset.first = String(!section.n);
  d.open = key in state.open ? state.open[key] : section.n === 0;
  section.n++;
  d.ontoggle = () => { state.open[key] = d.open; };
  d.append(el("summary", "", title));
  const b = el("div", "acc-body");
  if (hint) b.append(el("p", "hint", hint));
  children.forEach(c => b.append(c));
  d.append(b); return d;
}

const rowTools = (arr, i, mark = markSiteDirty) => {
  const t = el("div", "rowtools"), rerender = () => { mark(); renderView(); };
  const up = btn("↑", () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; rerender(); }, i === 0, "tool");
  const down = btn("↓", () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; rerender(); }, i === arr.length - 1, "tool");
  up.setAttribute("aria-label", "Move up"); down.setAttribute("aria-label", "Move down");
  t.append(up, down, btn("Remove", () => { arr.splice(i, 1); rerender(); }, false, "tool danger"));
  return t;
};

// A list you can add to, remove from and reorder. build(row, container) fills in the fields for one row.
function listEditor(title, hint, arr, blank, build, fontId) {
  const kids = [];
  arr.forEach((row, i) => {
    const box = el("div", "rowbox"), cols = el("div", "cols");
    build(row, cols); box.append(rowTools(arr, i), cols); kids.push(box);
  });
  kids.push(btn("+ Add another", () => { arr.push(blank()); markSiteDirty(); renderView(); }));
  if (fontId) kids.push(fontRow("Font for this text", fontId));
  return section(title, hint, ...kids);
}

// About paragraphs are stored as plain strings.
function paragraphEditor(title, hint, arr, fontId) {
  const kids = [];
  arr.forEach((t, i) => {
    const box = el("div", "rowbox"), ta = el("textarea"); ta.value = t; ta.oninput = () => { arr[i] = ta.value; markSiteDirty(); };
    box.append(rowTools(arr, i), ta); kids.push(box);
  });
  kids.push(btn("+ Add a paragraph", () => { arr.push(""); markSiteDirty(); renderView(); }));
  if (fontId) kids.push(fontRow("Font for this text", fontId));
  return section(title, hint, ...kids);
}

function siteView(body) {

    body.append(section("Extra sections", "Add your own sections to the bottom of this page: text, images, videos and more.", blockBuilder(ex[k], "extra:" + k)));
  }
}

function imageInput(lab, holder, key, afterChange) {
  const inp = el("input"); inp.type = "file"; inp.accept = "image/jpeg,image/png,image/webp";
  const pv = el("img", "preview" + (holder[key] ? " show" : "")); pv.alt = "";
  if (holder[key]) pv.src = imgSrc("pages", holder[key]);
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const b64 = await shrink(f), path = `img/${slug(holder.alt || "image")}-${uid()}.jpg`;
      state.pending.pages[path] = b64; holder[key] = path;
      pv.src = "data:image/jpeg;base64," + b64; pv.className = "preview show";
      markPagesDirty(); if (afterChange) afterChange();
    } catch (e) { toast(e.message, true); inp.value = ""; }
  };
  lab.append(inp, pv);
}

    const alt = textField("Short description", im, "alt", { mark: markPagesDirty });

// Turns an uploaded logo into something that works in one colour. SVG and transparent PNG are kept; a logo on a white background is converted.
async function prepLogo(file) {
  if (file.type === "image/svg+xml" || /\.svg$/i.test(file.name)) {
    const text = await file.text();
    if (text.length > 300000) throw new Error("That logo file is too large.");
    if (!/<svg[\s>]/i.test(text) || /<script|\son[a-z]+\s*=|javascript:|<foreignObject|<iframe|<!ENTITY|<embed|<object/i.test(text)) throw new Error("That SVG has parts that are not allowed. Please export a plain logo.");
    return { ext: "svg", b64: btoa(unescape(encodeURIComponent(text))), note: "" };
  }
  const url = URL.createObjectURL(file);
  const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("That logo could not be read. Use SVG, PNG or WebP.")); i.src = url; });
  URL.revokeObjectURL(url);
  const scale = Math.min(1, 600 / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.drawImage(im, 0, 0, w, h);
  const data = g.getImageData(0, 0, w, h), px = data.data;
  let see = false; for (let i = 3; i < px.length; i += 4) if (px[i] < 250) { see = true; break; }
  let note = "";
  if (!see) {
    const lum = (x, y) => { const k = (y * w + x) * 4; return 0.299 * px[k] + 0.587 * px[k + 1] + 0.114 * px[k + 2]; };
    const corners = (lum(0, 0) + lum(w - 1, 0) + lum(0, h - 1) + lum(w - 1, h - 1)) / 4;
    if (corners > 200) {
      for (let i = 0; i < px.length; i += 4) { const l = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; px[i] = px[i + 1] = px[i + 2] = 0; px[i + 3] = Math.max(0, Math.min(255, (255 - l) * 1.6)); }
      g.putImageData(data, 0, 0); note = "The white background was removed.";
    } else note = "This logo has a solid background, so it may show as a block. A PNG or SVG with a transparent background works best.";
  }
  return { ext: "png", b64: c.toDataURL("image/png").split(",")[1], note };
}

// ---------- Saving ----------
async function saveTab(tab) {
  const list = state.lists[tab];
  if (tab === "site") {
    list.nav = list.nav.filter(x => x.label.trim());
    list.social = list.social.filter(x => x.label.trim());
    list.footer.links = list.footer.links.filter(x => x.label.trim());
    list.about.facts = list.about.facts.filter(x => x.label.trim() || x.text.trim());
    list.about.paragraphs = list.about.paragraphs.map(t => t.trim()).filter(Boolean);
  }
  const used = new Set();
  if (Array.isArray(list)) list.forEach(x => used.add(x.img));
  else (function walk(o) { if (Array.isArray(o)) o.forEach(walk); else if (o && typeof o === "object") for (const [k, v] of Object.entries(o)) { if (k === "src" && typeof v === "string") used.add(v); else walk(v); } })(list);
  const images = Object.entries(state.pending[tab]).filter(([p]) => used.has(p)).map(([path, base64]) => ({ path, base64 }));
  const r = await api("/api/content", {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Admin": "1" },
    body: JSON.stringify({ file: tab, data: list, sha: state.shas[tab], images })
  });
  images.forEach(i => state.previews[i.path] = i.base64); // site may not have redeployed yet
  state.shas[tab] = r.sha; state.dirty[tab] = false; state.pending[tab] = {};
}

// Saves everything that changed, whether it was typed here or on the page itself.
async function save() {
  const tabs = Object.keys(state.dirty).filter(t => state.dirty[t]);
  if (!tabs.length) return;
  $("save").disabled = true; $("status").textContent = "Saving...";
  try { for (const t of tabs) await saveTab(t); toast("Saved. Your site updates in about a minute."); }
  catch (e) { toast(e.message, true); }
  if (state.view.name !== "edit") renderView();
  updateStatus();
}

const PV = { timer: null, scrollY: 0, target: null };

function pushPreview() {
  const images = { ...state.previews };

  const data = { ...state.lists };
  try { sessionStorage.setItem("previewData", JSON.stringify({ ...data, __images: images })); }

}

const pvUrl = hash => "/index.html?preview=1" + (state.editMode ? "&edit=1" : "") + (hash || "");

function refreshPreview(hash) {
  const f = $("pv");
  if (!f || $("previewPane").hidden) return;
  clearTimeout(PV.timer);
  PV.timer = setTimeout(() => {
    pushPreview();
    let y = 0; try { y = f.contentWindow.scrollY; } catch {}
    PV.scrollY = hash ? 0 : y;
    try { if (hash) f.contentWindow.location.hash = hash; f.contentWindow.location.reload(); }
    catch { f.src = pvUrl(hash); }
  }, 450);
}

// Move the preview to the page being edited, only when it is not already there.
function showInPreview(hash) {
  const f = $("pv"); if (!f || $("previewPane").hidden) return;
  let cur = ""; try { cur = f.contentWindow.location.hash; } catch {}
  if (cur !== hash) refreshPreview(hash);
}

$("pv").onload = () => {
  const y = PV.scrollY, target = PV.target; PV.scrollY = 0; PV.target = null;

      try { const e = $("pv").contentDocument.getElementById(target); if (e && e.children.length) { e.scrollIntoView({ block: "center" }); clearInterval(t); } } catch { clearInterval(t); }

  if (!y) return;
  let n = 0;

    try {
      const m = $("pv").contentDocument.getElementById("menu");
      if (m && m.children.length) { $("pv").contentWindow.scrollTo(0, y); clearInterval(t); }

    if (++n > 20) clearInterval(t);

};

  $("editToggle").setAttribute("aria-pressed", String(state.editMode));
  $("editToggle").textContent = "Edit on the page: " + (state.editMode ? "On" : "Off");
  let h = ""; try { h = $("pv").contentWindow.location.hash; } catch {}
  pushPreview(); $("pv").src = pvUrl(h);
};

// Edits typed straight into the page arrive here.
const setPath = (o, path, v) => { const k = path.split("."); const last = k.pop(); k.reduce((a, x) => a[x], o)[last] = v; };
window.addEventListener("message", async e => {
  const m = e.data;
  if (e.origin !== location.origin || e.source !== $("pv").contentWindow || !m || m.source !== "site-edit") return;
  try {
    if (m.type === "edit" || m.type === "font") {
      const file = m.type === "font" ? "site" : m.file;
      await load(file);
      if (m.type === "edit") setPath(state.lists[file], m.path, m.value);
      else { const d = state.lists.site; d.fonts = d.fonts || {}; if (m.font) d.fonts[m.id] = m.font; else delete d.fonts[m.id]; }
      state.dirty[file] = true; updateStatus();
    } else if (m.type === "blur") {
      if (state.view.name !== "edit") renderView();
    }
  } catch (err) { toast(err.message, true); }
});

function startPreview() {
  $("shell").classList.remove("nopv"); $("previewPane").hidden = false;
  pushPreview();
  $("pv").src = pvUrl(viewHash());
}

async function init() {
  let me;
  try { me = await api("/api/me"); } catch { showLogin(); return; }
  state.me = me; $("who-name").textContent = me.login + (me.role === "owner" ? "" : " (editor)"); $("who").hidden = false; $("topctl").hidden = false;
  $("login").hidden = true; $("app").hidden = false;
  try {
    await Promise.all(["photos", "writing", "quotes", "site", "pages"].map(load));
    loadAdminFonts(); renderView(); startPreview();
  } catch (e) {
    $("sideBody").textContent = "Could not load your content. " + e.message;
    toast("Could not load your content. " + e.message, true);
  }
}

$("back").onclick = back;
$("save").onclick = save;
$("signout").onclick = async () => { await fetch("/api/me", { method: "POST" }); showLogin(); };
window.addEventListener("beforeunload", e => { if (Object.values(state.dirty).some(Boolean)) { e.preventDefault(); e.returnValue = ""; } });
init();
</script>
</body>
</html>
